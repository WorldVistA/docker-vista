<VirtualHost *:80>
  ServerName localhost
  ErrorLog ${APACHE_LOG_DIR}/vivian_error.log
  CustomLog ${APACHE_LOG_DIR}/vivian_access.log combined
  DocumentRoot /var/www/html
  DirectoryIndex index.php index.html

  <Directory /var/www/html>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
  </Directory>

  # PHP-FPM handler. entrypoint.sh rewrites the socket path at container start
  # to match whichever php-fpm version is installed under /etc/php/<ver>/.
  <FilesMatch \.php$>
    SetHandler "proxy:unix:/run/php/php8.1-fpm.sock|fcgi://localhost"
  </FilesMatch>
</VirtualHost>
